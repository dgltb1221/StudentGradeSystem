{% extends "base.html" %}

{% block title %}添加学生{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-7">
        <div class="page-card p-4">
            <h1 class="page-title">添加学生</h1>
            <p class="page-subtitle mb-4">带 <span class="text-danger">*</span> 的为必填项</p>

            <form method="post">
                <div class="mb-3">
                    <label for="name" class="form-label">姓名 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="name" name="name" maxlength="50"
                           placeholder="请输入学生姓名" value="{{ request.form.get('name', '') }}" required>
                </div>
                <div class="mb-4">
                    <label for="class_name" class="form-label">班级</label>
                    <input type="text" class="form-control" id="class_name" name="class_name" maxlength="20"
                           placeholder="例如：三年级一班" value="{{ request.form.get('class_name', '') }}">
                    <div class="form-text">留空时列表中显示为“未设置”。</div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary px-4">保存</button>
                    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary px-4">返回</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
