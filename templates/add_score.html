{% extends "base.html" %}

{% block title %}录入成绩 - {{ student.name }}{% endblock %}

{% block content %}
<h1>录入成绩：{{ student.name }}</h1>
<p class="text-muted">班级：{{ student.class_name or '未设置' }}</p>

<form method="post">
    <div class="mb-3">
        <label for="subject" class="form-label">科目 <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="subject" name="subject" placeholder="例如：数学" value="{{ request.form.get('subject', '') }}" required>
    </div>
    <div class="mb-3">
        <label for="value" class="form-label">分数 <span class="text-danger">*</span></label>
        <input type="number" class="form-control" id="value" name="value" placeholder="例如:95.5" step="0.1" value="{{ request.form.get('value', '') }}" required>
    </div>
    <button type="submit" class="btn btn-primary">保存成绩</button>
    <a href="{{ url_for('student_detail', student_id=student.id) }}" class="btn btn-secondary">返回</a>
</form>
{% endblock %}
