{% extends "base.html" %}

{% block title %}学生列表{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>学生列表</h1>
    <a href="{{ url_for('add_student') }}" class="btn btn-success">添加学生</a>
</div>

{% if students %}
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>姓名</th>
                    <th>班级</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                {% for student in students %}
                <tr>
                    <td>{{ student.id }}</td>
                    <td>{{ student.name }}</td>
                    <td>{{ student.class_name or '未设置' }}</td>
                    <td>
                        <a href="{{ url_for('add_score', student_id=student.id) }}" class="btn btn-sm btn-success">录入成绩</a>
                        <a href="{{ url_for('student_detail', student_id=student.id) }}" class="btn btn-sm btn-info">查看成绩</a>
                        <form action="{{ url_for('delete_student', student_id=student.id) }}" method="POST" style="display: inline-block;">
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('确定要删除该学生及其所有成绩吗？')">删除</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% else %}
    <div class="alert alert-info">还没有学生，请添加！</div>
{% endif %}
{% endblock %}
